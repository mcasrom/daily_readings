analytics:
  stopwords_langs:
  - es
  - en
  - fr
  - it
  - pt
  - de
  top_n_words: 50
  word_windows:
  - 3
  - 5
  - 7
clustering:
  min_cluster_size: 2
  min_samples: 1
  similarity_threshold: 0.75
  window_days: 7
deploy:
  github_branch: main
  github_repo: git@github.com:mcasrom/daily_readings.git
  server_host: viaje
  server_path: /var/www/daily_readings
  site_domain: news.viajeinteligencia.com
llm:
  production:
    gemini_model: models/embedding-001
    groq_model: llama-3.3-70b-versatile
  test:
    ollama_embed: tinyllama
    ollama_model: tinyllama
mode: production
rotation:
  backoff_base: 2
  cache_ttl: 1800
  jitter: true
  max_retries: 3
  min_interval: 900
sources:
  alemania:
  - lang: de
    name: Der Spiegel
    type: general
    url: https://www.spiegel.de/schlagzeilen/index.rss
  - lang: en
    name: Deutsche Welle
    type: general
    url: https://rss.dw.com/rdf/rss-en-world
